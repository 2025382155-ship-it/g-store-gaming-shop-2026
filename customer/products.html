<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse G-Store consoles, games and gaming accessories by platform and category.">
  <title>Shop | G-Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body class="market-page">
  <nav class="navbar navbar-expand-lg market-navbar sticky-top"><div class="container py-2">
    <a class="navbar-brand" href="home.html"><i class="bi bi-controller me-2"></i>G-STORE</a>
    <button class="navbar-toggler border-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#storeNav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="storeNav">
      <ul class="navbar-nav market-nav mx-auto"><li class="nav-item"><a class="nav-link" href="home.html">Home</a></li><li class="nav-item"><a class="nav-link active" href="products.html">Shop</a></li><li class="nav-item"><a class="nav-link" data-customer-nav href="profile.html">My Account</a></li></ul>
      <div class="d-flex gap-2"><a class="btn btn-outline-light btn-sm" href="cart.html"><i class="bi bi-cart3 me-1"></i>Cart <span data-cart-count>0</span></a><a class="btn btn-primary btn-sm" href="../index.html?login=1" data-store-signin>Sign In</a><button class="btn btn-outline-light btn-sm d-none" data-auth-logout>Logout</button></div>
    </div>
  </div></nav>
  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
      <div><p class="text-primary text-uppercase fw-bold small mb-1">G-Store Store</p><h1>Shop</h1></div>
      <a href="orders.html" class="btn btn-outline-light btn-sm d-none" data-customer-nav>My Orders</a>
    </div>
    <nav class="shop-category-nav mb-4" aria-label="Product categories">
      <button class="shop-category" type="button" data-shop-category="playstation" aria-pressed="false">PlayStation</button>
      <button class="shop-category" type="button" data-shop-category="xbox" aria-pressed="false">Xbox</button>
      <button class="shop-category" type="button" data-shop-category="nintendo" aria-pressed="false">Nintendo</button>
      <button class="shop-category" type="button" data-shop-category="games" aria-pressed="false">Games</button>
      <button class="shop-category" type="button" data-shop-category="accessories" aria-pressed="false">Accessories</button>
    </nav>
    <input id="category-filter" type="hidden" value="">
    <div class="filter-bar row g-3 mb-4">
      <div class="col-md-5"><input class="form-control" id="product-search" type="search" placeholder="Search products by name..." aria-label="Search products"></div>
      <div class="col-sm-6 col-md-4"><select class="form-select" id="platform-filter" aria-label="Filter by platform"><option value="">All platforms</option><option>PlayStation</option><option>Xbox</option><option>Nintendo Switch</option><option>Nintendo Switch 2</option><option>Multi-platform</option></select></div>
      <div class="col-sm-6 col-md-3"><select class="form-select" id="shop-sort" aria-label="Sort products"><option value="featured">Sort: Featured</option><option value="newest">Newest</option><option value="popular">Popular</option><option value="price-low">Price: Low to high</option><option value="price-high">Price: High to low</option></select></div>
    </div>
    <div id="store-feedback" aria-live="polite"></div>
    <div class="row g-4" id="product-grid"></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/auth.js"></script><script src="../js/customer.js"></script><script src="../js/store.js"></script>
</body>
</html>
