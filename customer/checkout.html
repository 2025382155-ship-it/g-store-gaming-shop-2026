<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checkout | G-Store</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="../css/style.css" rel="stylesheet"></head>
<body class="market-page"><nav class="navbar navbar-expand-lg market-navbar"><div class="container py-2"><a class="navbar-brand" href="home.html"><i class="bi bi-controller me-2"></i>G-STORE</a><a class="btn btn-outline-light btn-sm ms-auto" href="cart.html"><i class="bi bi-arrow-left me-1"></i>Back to Cart</a></div></nav>
<main class="container py-5"><h1 class="mb-4">Checkout</h1><div id="store-feedback"></div><div class="row g-4"><div class="col-lg-7"><form class="management-panel" id="checkout-form">
<h2 class="h5">Delivery details</h2><div class="row g-3 mt-1"><div class="col-md-6"><label class="form-label">Full name</label><input class="form-control" name="name" required></div><div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone" required></div><div class="col-12"><label class="form-label">Address</label><textarea class="form-control" name="address" required></textarea></div></div>
<h2 class="h5 mt-4">Simulated Payment</h2><p class="small text-secondary">No real payment will be processed.</p><button class="btn btn-primary auth-submit w-100 mt-3" type="submit">Place Order</button></form></div>
<aside class="col-lg-5"><div class="management-panel"><h2 class="h5">Your order</h2><div id="checkout-summary" class="mt-3"></div><hr><div class="d-flex justify-content-between fs-5"><span>Total</span><strong id="checkout-total">RM0.00</strong></div></div></aside></div></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="../js/auth.js"></script><script src="../js/customer.js"></script><script src="../js/store.js"></script></body></html>
