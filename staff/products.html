<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Manage the G-Store product catalogue and pricing."><title>Admin Products | G-Store</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="../css/style.css" rel="stylesheet"></head>
<body class="market-page"><aside class="staff-sidebar p-4"><a class="navbar-brand d-block mb-4" href="dashboard.html" aria-label="G-Store Admin Dashboard"><i class="bi bi-controller me-2"></i>G-STORE</a><nav class="nav flex-column mb-4"><a class="nav-link" href="dashboard.html"><i class="bi bi-grid me-2"></i>Dashboard</a><a class="nav-link active" href="products.html"><i class="bi bi-box-seam me-2"></i>Products</a><a class="nav-link" href="inventory.html"><i class="bi bi-clipboard-data me-2"></i>Inventory</a><a class="nav-link" href="orders.html"><i class="bi bi-bag me-2"></i>Orders</a><a class="nav-link" href="customers.html"><i class="bi bi-people me-2"></i>Customers</a><a class="nav-link" href="reports.html"><i class="bi bi-bar-chart me-2"></i>Reports</a></nav><div class="admin-account"><i class="bi bi-person-circle me-2"></i>Admin Account</div><button class="btn btn-outline-light btn-sm w-100" data-auth-logout><i class="bi bi-box-arrow-right me-1"></i>Logout</button></aside>
<main class="staff-main"><div class="d-flex justify-content-between mb-4"><div><p class="text-primary small fw-bold">ADMIN CATALOG &amp; INVENTORY</p><h1>Products &amp; Inventory</h1></div><button class="btn btn-primary auth-submit" id="new-product" data-bs-toggle="modal" data-bs-target="#product-modal">Add Product</button></div><div id="staff-feedback"></div><div class="table-responsive"><table class="table staff-table"><thead><tr><th>ID</th><th>Name</th><th>Category</th><th>Platform</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th></tr></thead><tbody id="staff-product-table"></tbody></table></div></main>
<div class="modal fade" id="product-modal"><div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header"><h2 class="modal-title fs-5">Product Details</h2><button class="btn-close" data-bs-dismiss="modal"></button></div><form id="staff-product-form"><div class="modal-body row g-3">
<div class="col-md-4"><label class="form-label">Product ID</label><input class="form-control" name="id" required></div><div class="col-md-8"><label class="form-label">Product Name</label><input class="form-control" name="name" required></div>
<div class="col-md-4"><label class="form-label">Category</label><select class="form-select" name="category" required><option>PlayStation</option><option>Xbox</option><option>Nintendo</option><option>Games</option><option>Accessories</option></select></div><div class="col-md-4"><label class="form-label">Platform</label><select class="form-select" name="platform" required><option>PlayStation</option><option>PlayStation 5</option><option>PlayStation 4</option><option>Xbox</option><option>Xbox Series X</option><option>Nintendo Switch</option><option>Nintendo Switch 2</option><option>Multi-platform</option></select></div><div class="col-md-4"><label class="form-label">Brand</label><input class="form-control" name="brand" required></div>
<div class="col-12"><label class="form-label">Description</label><textarea class="form-control" name="description" required></textarea></div>
<div class="col-md-4"><label class="form-label">Variant group</label><input class="form-control" name="variantGroup" placeholder="e.g. PlayStation consoles"></div><div class="col-md-4"><label class="form-label">Model</label><input class="form-control" name="model"></div><div class="col-md-4"><label class="form-label">Edition</label><input class="form-control" name="edition"></div>
<div class="col-md-4"><label class="form-label">Storage</label><input class="form-control" name="storage" placeholder="e.g. 1TB"></div><div class="col-md-4"><label class="form-label">Colour</label><input class="form-control" name="color"></div><div class="col-md-4"><label class="form-label">Game/accessory format</label><input class="form-control" name="mediaFormat" placeholder="e.g. Physical disc"></div>
<div class="col-md-4"><label class="form-label">Price (RM)</label><input class="form-control" name="price" type="number" min="0" step="0.01" required></div><div class="col-md-4"><label class="form-label">Stock quantity</label><input class="form-control" name="stock" type="number" min="0" required></div><div class="col-md-4"><label class="form-label">Condition</label><select class="form-select" name="condition"><option>New</option><option>Pre-owned</option></select></div><div class="col-12"><label class="form-label">Image URL</label><input class="form-control" name="image" placeholder="../images/... or image URL"></div><input type="hidden" name="status">
</div><div class="modal-footer"><button class="btn btn-primary auth-submit">Save Product</button></div></form></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="../js/auth.js"></script><script src="../js/customer.js"></script><script src="../js/store.js"></script><script src="../js/staff.js"></script></body></html>
