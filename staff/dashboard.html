<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="G-Store staff dashboard for sales, products, customers and inventory overview."><title>Admin Dashboard | G-Store</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="../css/style.css" rel="stylesheet"></head>
<body class="market-page">
<aside class="staff-sidebar p-4"><a class="navbar-brand d-block mb-4" href="dashboard.html" aria-label="G-Store Admin Dashboard"><i class="bi bi-controller me-2"></i>G-STORE</a><nav class="nav flex-column mb-4">
<a class="nav-link active" href="dashboard.html"><i class="bi bi-grid me-2"></i>Dashboard</a><a class="nav-link" href="products.html"><i class="bi bi-box-seam me-2"></i>Products</a><a class="nav-link" href="inventory.html"><i class="bi bi-clipboard-data me-2"></i>Inventory</a><a class="nav-link" href="orders.html"><i class="bi bi-bag me-2"></i>Orders</a><a class="nav-link" href="customers.html"><i class="bi bi-people me-2"></i>Customers</a><a class="nav-link" href="reports.html"><i class="bi bi-bar-chart me-2"></i>Reports</a></nav><div class="admin-account"><i class="bi bi-person-circle me-2"></i>Admin Account</div><button class="btn btn-outline-light btn-sm w-100" data-auth-logout><i class="bi bi-box-arrow-right me-1"></i>Logout</button></aside>
<main class="staff-main"><div id="staff-dashboard">
<div class="mb-4"><p class="text-info text-uppercase fw-bold small mb-1">Admin overview</p><h1>Admin Dashboard</h1></div>
<section class="row g-3 mb-4"><div class="col-sm-6 col-xl"><div class="dashboard-stat p-4">Products<strong id="dash-products">0</strong></div></div><div class="col-sm-6 col-xl"><div class="dashboard-stat p-4">Customers<strong id="dash-customers">0</strong></div></div><div class="col-sm-6 col-xl"><div class="dashboard-stat p-4">Orders<strong id="dash-orders">0</strong></div></div><div class="col-sm-6 col-xl"><div class="dashboard-stat p-4">Revenue<strong id="dash-revenue">RM0.00</strong></div></div><div class="col-sm-6 col-xl"><div class="dashboard-stat p-4">Low stock<strong id="dash-low">0</strong></div></div></section>
<div class="row g-4 mb-4"><div class="col-lg-8"><div class="management-panel"><h2 class="h5">Monthly Sales</h2><canvas id="sales-chart"></canvas></div></div><div class="col-lg-4"><div class="management-panel"><h2 class="h5">Sales by Category</h2><canvas id="category-chart"></canvas></div></div></div>
<div class="row g-4"><div class="col-lg-4"><div class="management-panel"><h2 class="h5">Best-selling Products</h2><div id="best-sellers"></div></div></div><div class="col-lg-4"><div class="management-panel"><h2 class="h5">Most Active Customers</h2><div id="most-active-customers"></div></div></div><div class="col-lg-4"><div class="management-panel"><h2 class="h5">Recent Orders</h2><div class="table-responsive"><table class="table staff-table"><tbody id="dash-recent"></tbody></table></div></div></div></div>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script><script src="../js/auth.js"></script><script src="../js/customer.js"></script><script src="../js/store.js"></script><script src="../js/staff.js"></script></body></html>
