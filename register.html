<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Create a G-Store customer account.">
  <title>Create Account | G-Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card row g-0" aria-labelledby="register-title">
      <div class="col-lg-5 auth-brand-panel">
        <div class="brand-mark" aria-hidden="true"><i class="bi bi-controller"></i></div>
        <p class="brand-name">G-STORE</p>
        <h1 class="brand-tagline">Your Games.<br>Your World.</h1>
        <p class="brand-copy">Join the community and start building your next great collection.</p>
      </div>

      <div class="col-lg-7 auth-form-panel">
        <div class="auth-form-wrap register-form-wrap">
          <p class="auth-eyebrow">JOIN G-STORE</p>
          <h2 id="register-title">Create your account</h2>
          <p class="auth-subtitle">Your gaming world starts here.</p>

          <div id="register-alert" class="alert d-none" role="alert" aria-live="polite"></div>

          <form id="register-form" novalidate>
            <div class="mb-3">
              <label for="register-name" class="form-label">Full name</label>
              <div class="input-group auth-input">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="register-name" name="fullName"
                       autocomplete="name" placeholder="Your full name" minlength="2" required>
              </div>
            </div>

            <div class="mb-3">
              <label for="register-email" class="form-label">Email address</label>
              <div class="input-group auth-input">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="register-email" name="email"
                       autocomplete="email" placeholder="name@example.com" required>
              </div>
            </div>

            <div class="mb-3">
              <label for="register-password" class="form-label">Password</label>
              <div class="input-group auth-input">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="register-password" name="password"
                       autocomplete="new-password" placeholder="At least 8 characters" minlength="8" required>
                <button class="btn password-toggle" type="button" data-password-toggle="register-password"
                        aria-label="Show password" title="Show password">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
              <div class="form-text">Use at least 8 characters, including a number and a letter.</div>
            </div>

            <div class="mb-4">
              <label for="register-confirm-password" class="form-label">Confirm password</label>
              <div class="input-group auth-input">
                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                <input type="password" class="form-control" id="register-confirm-password" name="confirmPassword"
                       autocomplete="new-password" placeholder="Repeat your password" minlength="8" required>
                <button class="btn password-toggle" type="button" data-password-toggle="register-confirm-password"
                        aria-label="Show password" title="Show password">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <button type="submit" class="btn btn-primary auth-submit w-100">
              Create account <i class="bi bi-arrow-right-short"></i>
            </button>
          </form>

          <p class="auth-switch">Already have an account? <a href="index.html?login=1">Sign in</a></p>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
