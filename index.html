<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in to G-Store, your gaming retail store.">
  <title>Sign In | G-Store</title>
  <script>
    if (!new URLSearchParams(window.location.search).has("login") &&
        !new URLSearchParams(window.location.search).has("purchase")) {
      window.location.replace("customer/home.html");
    }
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="auth-page">
  <div class="ecosystem-background" aria-hidden="true">
    <span class="ecosystem-shape ecosystem-controller ecosystem-controller-a"></span>
    <span class="ecosystem-shape ecosystem-controller ecosystem-controller-b"></span>
    <span class="ecosystem-shape ecosystem-dpad ecosystem-dpad-a"></span>
    <span class="ecosystem-shape ecosystem-dpad ecosystem-dpad-b"></span>
    <span class="ecosystem-shape ecosystem-handheld ecosystem-handheld-a"></span>
    <span class="ecosystem-shape ecosystem-handheld ecosystem-handheld-b"></span>
    <span class="ecosystem-shape ecosystem-keyboard ecosystem-keyboard-a"></span>
    <span class="ecosystem-shape ecosystem-mouse ecosystem-mouse-a"></span>
    <span class="ecosystem-shape ecosystem-joystick ecosystem-joystick-a"></span>
    <span class="ecosystem-shape ecosystem-circuit ecosystem-circuit-a"></span>
    <span class="ecosystem-shape ecosystem-circuit ecosystem-circuit-b"></span>
    <span class="ecosystem-shape ecosystem-pixels ecosystem-pixels-a"></span>
    <span class="ecosystem-shape ecosystem-pixels ecosystem-pixels-b"></span>
    <span class="ecosystem-shape ecosystem-ring ecosystem-ring-a"></span>
  </div>
  <main class="auth-shell">
    <section class="auth-card row g-0" aria-labelledby="login-title">
      <div class="col-lg-5 auth-brand-panel login-brand-panel">
        <div class="brand-lockup">
          <div class="brand-mark" aria-hidden="true">
            <span class="iplay-symbol-core"></span>
            <span class="iplay-symbol-dpad"></span>
            <span class="iplay-symbol-buttons"></span>
          </div>
          <p class="brand-name">G-STORE</p>
        </div>
      </div>

      <div class="col-lg-7 auth-form-panel">
        <div class="auth-form-wrap">
          <p class="auth-eyebrow">WELCOME BACK</p>
          <h2 id="login-title">Sign in to G-Store</h2>

          <div id="login-alert" class="alert d-none" role="alert" aria-live="polite"></div>

          <form id="login-form" novalidate>
            <div class="mb-3">
              <label for="login-email" class="form-label">Email address</label>
              <div class="input-group auth-input">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="login-email" name="email"
                       autocomplete="email" placeholder="name@example.com" required>
              </div>
            </div>

            <div class="mb-4">
              <div class="d-flex justify-content-between align-items-center">
                <label for="login-password" class="form-label">Password</label>
              </div>
              <div class="input-group auth-input">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="login-password" name="password"
                       autocomplete="current-password" placeholder="Enter your password" required>
                <button class="btn password-toggle" type="button" data-password-toggle="login-password"
                        aria-label="Show password" title="Show password">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <button type="submit" class="btn btn-primary auth-submit w-100" id="login-submit">
              <span class="auth-submit-label">Sign in</span>
              <i class="bi bi-arrow-right-short auth-submit-icon" aria-hidden="true"></i>
            </button>
          </form>

          <p class="auth-switch">New to G-Store? <a href="register.html">Create an account</a></p>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
